<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
 "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
    <head>
	    <!-- Le HTML5 shim, for IE6-8 support of HTML elements -->
	    <!--[if lt IE 9]>
	    	<script type="text/javascript" src="/assets/html5shiv.js" th:src="@{/assets/html5shiv.js}"></script>	
	    <![endif]-->
	    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <title>[(${@environment.getProperty('aplicacion.titulo')})]</title>
        <link rel="shortcut icon" type="image/x-icon" href="/assets/favicon.ico" th:href="@{/assets/favicon.ico}"/>

		[(${zhead})]
		<link rel="stylesheet" type="text/css"	href="/assets/bootflat/personalizacion.css"	th:href="@{/assets/bootflat/personalizacion.css}" />
        <link rel="stylesheet" type="text/css" href="/assets/bootflat/aplicacion.css" th:href="@{/assets/bootflat/aplicacion.css}"/>
	    <!--[if lt IE 9]>
	    	<script type="text/javascript" src="/assets/respond.min.js" th:src="@{/assets/respond.min.js}"></script>
	    <![endif]-->
	    
	    <script type="text/javascript" src="/assets/aplicacion.js" th:src="@{/assets/aplicacion.js}"></script>
    </head>

	<body id="baseContainer">
		<div id="wrap">
			<!-- <img src="/assets/bootflat/logoWEB.png" th:src="@{/assets/bootflat/logoWEB.png}" th:alt="${@environment.getProperty('aplicacion.titulo')}"> -->
			<header id="top" class="header navbar" style="min-height: 80px">
				<div class="row" style="display: flex; align-items: center; margin-right: 0px; min-height: 80px">
					<div class="col-sm-8">
						<img src="/assets/bootflat/logoWEBv3.png" th:src="@{/assets/bootflat/logoWEBv3.png}" th:alt="${@environment.getProperty('aplicacion.titulo')}" style="max-width: 100%; max-height: 59px; padding-left: 8px">
					</div>
					<div class="col-sm-2">
						<img class="" src="/assets/bootflat/logoCervixv7.png" th:src="@{/assets/bootflat/logoCervixv7.png}" th:alt="${@environment.getProperty('aplicacion.titulo')}" style="max-height: 75px">
					</div>
					<div class="col-sm-2">
						<img class="pull-right" src="/assets/bootflat/sgi.png" th:src="@{/assets/bootflat/sgi.png}" alt="Servicio de Gestión de Informática" style="max-height: 60px; padding-right: 8px">
					</div>
				</div>
    		</header>
    		<div id="spinner" class="spinner" style="display:none;">
				<img src="/assets/spinner.gif" th:src="@{/assets/spinner.gif}"/>
		    </div>

			<div id="container">
		    	<div id="row">
					<div class="sidebar active">
		                  <!--BOTÓN PARA PLEGAR Y DESPLEGAR-->
						<div class="menu-btn">
		                	<i class="icon z-icon-chevron-left"></i>
		              	</div>
		                  <!--CABECERA CON DATOS DE USUARIO-->
						<div class="head">
							<div class="user-img-sanidad" th:style="${'background-color: ' + session.colorPerfil }">
		          				<img alt="" src="/assets/bootflat/linea_cervix.png"
									 th:src="@{/assets/bootflat/linea_cervix.png}">
		      				</div>
			      			<div class="user-details">
					        	<p class="title" th:text="${session.unidad_funcional.descripcion}">ROL USER</p>
					        	<p class="name" th:text="${session.loginUnico}">usuario</p>
			      			</div>
			  			</div>
		                  <!--MENÚ NAVEGACIÓN CON ÍTEMS-->
			          	<div class="nav">
			            	<div class="menu">
			                	<ul>
			                    	<li th:each="item : ${menu}">
			                        	<a th:href="${item.redireccion}" th:if="${item.redireccion != null}"
			                             th:attr="target=${item.redireccion.contains('http') ? '_blank' : '_self'}">
			                            	<i th:class="${item.icono}"></i>
			                            	<span class="text" th:text="${item.descripcion}"></span>
			                          	</a>
			                          	<a th:if="${item.redireccion == null}">
			                            	<i th:class="${item.icono}"></i>
			                              	<span class="text" th:text="${item.descripcion}"></span>
			                              	<i class="arrow z-icon-chevron-right"></i>
			                          	</a>
			                          	<ul th:class="${item.submodulos.size() < 9 ?'sub-menu':'sub-menu-large'}"
			                              th:if="${item.redireccion == null && !item.submodulos.isEmpty()}">
			                            	<li th:each="subItem : ${item.submodulos}">
			                                	<a th:href="${subItem.redireccion}" th:if="${subItem.redireccion != null}"
			                                     th:attr="target=${subItem.redireccion.contains('http') ? '_blank' : '_self'}">
			                                    	<i th:class="${subItem.icono}" th:if="${subItem.icono != null}"></i>
			                                     	<span class="text" th:text="${subItem.descripcion}"></span>
			                                  	</a>
			                                  	<a th:if="${subItem.redireccion == null}">
			                                   		<i th:class="${subItem.icono}" th:if="${subItem.icono != null}"></i>
			                                      	<span class="text" th:text="${subItem.descripcion}"></span>
			                                      	<i class="arrow-sub-menu z-icon-chevron-right"></i>
			                                  	</a>
			                                  	<ul class="sub-menu sub-menu-hijo"
			                                      th:if="${subItem.redireccion == null && !subItem.submodulos.isEmpty()}">
			                                    	<li th:each="subSubItem : ${subItem.submodulos}">
			                                         	<a th:href="${subSubItem.redireccion}"
			                                             th:attr="target=${subSubItem.redireccion.contains('http') ? '_blank' : '_self'}">
			                                            	<i th:class="${subSubItem.icono}"
			                                              th:if="${subSubItem.icono != null}"></i>
			                                            	<span class="text" th:text="${subSubItem.descripcion}"></span>
			                                          	</a>
			                                      	</li>
			                                  	</ul>
			                              	</li>
			                          	</ul>
			                      	</li>
			                  	</ul>
			              	</div>
			          	</div>
		            <!--PIE CON BOTÓN DE DESCONEXIÓN-->
			           	<div class="menu" th:if="${session.loginUnico}">
			            	<div class="title">Usuario</div>
			            	<ul>
			                	<li class="log-box">
			                    	<a class="log-box-hover" href="../logoff">
			                        	<i class="icon z-icon-power-off"></i>
			                          	<span class="text">Desconexión</span>
			                      	</a>
			                  	</li>
			              	</ul>
			            </div>
					</div>
			      	<div class="layout-sanidad">
			        	<div class="hero">  [(${zbody})]</div>
			      	</div>
				</div>
			</div>
			<div id="push"></div>
		</div>
	     
		<div id="footer">
			<!-- Inicio Pie -->
			<footer>
				<div id="footer-extra">
					<div class="container">
						<div class="row">
							<div class="col-md-8">
								&copy; 2026 [(${@environment.getProperty('aplicacion.salud')})]
							</div>
							<div class="col-md-4">
								<span class="pull-right" th:text="${@environment.getProperty('aplicacion.version')}" >Versión x.x.x</span>
							</div>
						</div>		
					</div>		
				</div>            
			</footer> 
			<!-- Fin Pie -->
		</div>
   </body>
</html>
